ENABLE_ATTACH_FROM_FILES_TITLE=Enable Attach From Files
ENABLE_DRAFT_AUTO_SAVE_DESC=\nIf On, Secure Mail supports automatically saving messages to the Drafts folder.\n\nDefault value is On.\n
